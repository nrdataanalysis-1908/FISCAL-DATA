services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fiscal_data
      POSTGRES_USER: fiscal_data
      POSTGRES_PASSWORD: change_me
    ports:
      - "5432:5432"
    volumes:
      - fiscal_data_pg:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiscal_data -d fiscal_data"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://fiscal_data:change_me@db:5432/fiscal_data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  fiscal_data_pg:
